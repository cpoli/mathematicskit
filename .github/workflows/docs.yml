name: Docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    # sphinx-gallery re-executes every examples/*/plot_*.py, so this is the
    # only check that catches a broken gallery example or a bad
    # ".. minigallery::" path in docs/source/history/.
    name: Build Sphinx docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The key covers everything an example's output can depend on, so a
      # hit means a passing build already ran this exact gallery and
      # sphinx-gallery skips every example; any change runs them all.
      - name: Restore executed gallery
        uses: actions/cache@v5
        with:
          path: |
            docs/source/api/gallery
            docs/source/gen_modules
          key: gallery-${{ hashFiles('mathematicskit/**', 'examples/**', 'docs/source/conf.py', 'pyproject.toml', '.github/workflows/docs.yml') }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[fast,docs]"
      - run: cd docs && MPLBACKEND=Agg make html
