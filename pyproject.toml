[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mathematicskit"
dynamic = ["version"]
description = "Unified computational mathematics toolkit: numerical analysis, linear algebra, calculus, dynamical systems, partial differential equations, optimization, probability, statistics, number theory, combinatorics, complex analysis, graph theory, abstract algebra, geometry, special functions, and fractals/chaos -- built on numpy/scipy, hand-rolling algorithms only where no library equivalent exists."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Charles Poli", email = "cpoli374@gmail.com" }]
maintainers = [{ name = "Charles Poli", email = "cpoli374@gmail.com" }]
keywords = [
    "mathematics",
    "numerical-analysis",
    "linear-algebra",
    "computational-mathematics",
    "optimization",
    "partial-differential-equations",
    "graph-theory",
    "number-theory",
    "probability",
    "statistics",
    "education",
    "numerical-methods",
    "dynamical-systems",
    "fractals",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
    "Topic :: Education",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.6",
]

[project.optional-dependencies]
# Numba JIT-compiles the ode_dynamics/fractals_chaos/pde/integrators kernels;
# without it they run as plain Python (same results, slower). See mathematicskit/_jit.py.
fast = ["numba>=0.58"]
test = ["pytest>=7.0", "pytest-cov", "hypothesis>=6.90", "pillow>=9.0"]
docs = [
    "sphinx>=7.0",
    "pydata-sphinx-theme>=0.15",
    "sphinx-autodoc-typehints>=1.25",
    "myst-parser>=2.0",
    "sphinx-gallery>=0.15",
    "sphinx-design>=0.6",
    "jupyterlite-sphinx>=0.17",
    "jupyterlite-pyodide-kernel>=0.4",
]
dev = ["mathematicskit[fast,test,docs]", "ruff>=0.6", "mypy>=1.10", "pre-commit>=3.7"]

[project.urls]
Homepage = "https://github.com/cpoli/mathematicskit"
Issues = "https://github.com/cpoli/mathematicskit/issues"
Changelog = "https://github.com/cpoli/mathematicskit/blob/main/CHANGELOG.md"
Documentation = "https://cpoli.github.io/mathematicskit/"

[tool.setuptools.packages.find]
where = ["."]
include = ["mathematicskit*"]
# Tests live beside each subpackage; they stay in the sdist but not the wheel.
exclude = ["mathematicskit.tests", "mathematicskit.*.tests"]

[tool.setuptools.dynamic]
version = { attr = "mathematicskit.__version__" }

[tool.setuptools.package-data]
mathematicskit = ["py.typed"]

# include-package-data (on by default) would otherwise re-add each
# subpackage's tests/ directory as package data of its parent.
[tool.setuptools.exclude-package-data]
"*" = ["tests/*", "tests/**/*"]

[tool.pytest.ini_options]
testpaths = [
    "mathematicskit/abstract_algebra/tests",
    "mathematicskit/calculus/tests",
    "mathematicskit/combinatorics/tests",
    "mathematicskit/complex_analysis/tests",
    "mathematicskit/fractals_chaos/tests",
    "mathematicskit/geometry/tests",
    "mathematicskit/graph_theory/tests",
    "mathematicskit/integrators/tests",
    "mathematicskit/linalg/tests",
    "mathematicskit/number_theory/tests",
    "mathematicskit/numerical_analysis/tests",
    "mathematicskit/ode_dynamics/tests",
    "mathematicskit/optimization/tests",
    "mathematicskit/pde/tests",
    "mathematicskit/probability/tests",
    "mathematicskit/special_functions/tests",
    "mathematicskit/statistics/tests",
    "mathematicskit/tests",
]

[tool.ruff]
line-length = 160
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = [
    "E731", # lambda assignment: used deliberately for short closures (e.g. test-function factories)
    "B023", # loop-variable closures: intentional in model-builder factory functions
    "E741", # single-letter names (n, k, x, i, j): standard mathematical notation throughout this package
    "SIM108", # if/else vs ternary: kept as if/else for readability around multi-line mathematical expressions
    "SIM300", # yoda-condition rewrites: not an improvement for pytest.approx(...) == value assertions
    "UP045", # X | None vs Optional[X]: keep Optional[] for clarity, it's equally valid under `from __future__ import annotations`
]

[tool.ruff.lint.per-file-ignores]
"mathematicskit/*/tests/*" = ["E501", "E402"] # E402: pytest.importorskip(...) before imports, for optional-dependency tests
"docs/*" = ["E501", "I001", "E402"]

[tool.ruff.format]
line-ending = "lf"

[tool.mypy]
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_ignores = true
# Unannotated function bodies are not checked; see CONTRIBUTING.md.
check_untyped_defs = false
